<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Server Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
        tr.fraud { background-color: #ffebee; }
        tr.reversed { background-color: #e0e0e0; color: #888; text-decoration: line-through; }
        .btn { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-reverse { background: #d32f2f; color: white; }
        .btn-reverse:hover { background: #b71c1c; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-fraud { background: #d32f2f; color: white; }
        .badge-ok { background: #388e3c; color: white; }
    </style>
</head>
<body>
    <h1>Fraud Monitoring Admin Panel</h1>
    <p>View all recent transactions and reverse fraudulent activities.</p>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Sender ID</th>
                <th>Receiver ID</th>
                <th>Amount</th>
                <th>Timestamp</th>
                <th>Purpose</th>
                <th>Status</th>
                <th>Fraud Flag</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="txTable">
            <!-- Rows populated by JS -->
        </tbody>
    </table>

    <h2>User Directory</h2>
    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Balance</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <!-- Rows populated by JS -->
        </tbody>
    </table>

    <script>
        async function fetchTransactions() {
            const res = await fetch('/api/admin/transactions');
            if (res.ok) {
                const data = await res.json();
                const tbody = document.getElementById('txTable');
                tbody.innerHTML = '';
                data.forEach(tx => {
                    let trClass = '';
                    if (tx.status === 'reversed') trClass = 'reversed';
                    else if (tx.is_fraud) trClass = 'fraud';

                    const fraudBadge = tx.is_fraud ? '<span class="badge badge-fraud">FRAUD</span>' : '<span class="badge badge-ok">OK</span>';
                    
                    let actionBtn = '';
                    if (tx.status === 'active') {
                        actionBtn = `<button class="btn btn-reverse" onclick="reverseTransaction(${tx.id})">Reverse</button>`;
                    }

                    tbody.innerHTML += `
                        <tr class="${trClass}">
                            <td>${tx.id}</td>
                            <td>${tx.sender_id}</td>
                            <td>${tx.receiver_id}</td>
                            <td>$${tx.amount.toFixed(2)}</td>
                            <td>${tx.timestamp}</td>
                            <td>${tx.purpose}</td>
                            <td>${tx.status}</td>
                            <td>${fraudBadge}</td>
                            <td>
                                ${actionBtn}
                                <button class="btn" style="background: #007bff; color: white;" onclick="explainTransaction(${tx.id})">Explain</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                alert("Failed to load transactions.");
            }
        }

        async function fetchUsers() {
            const res = await fetch('/api/admin/users');
            if (res.ok) {
                const data = await res.json();
                const tbody = document.getElementById('userTable');
                tbody.innerHTML = '';
                data.forEach(user => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>$${user.balance.toFixed(2)}</td>
                            <td>${user.is_admin ? 'Admin' : 'User'}</td>
                        </tr>
                    `;
                });
            }
        }

        async function explainTransaction(txId) {
            const res = await fetch(`/api/admin/explain/${txId}`);
            if (res.ok) {
                const data = await res.json();
                const attn = data.attention;
                const history = data.history;
                const reason = data.reason;
                
                let explainStr = `AI Diagnosis: ${reason}\n\n`;
                explainStr += "IEEE XAI Attention Map (Importance of last 10 steps):\n\n";
                history.forEach((h, i) => {
                    const weight = attn[i];
                    // Handle NaN gracefully
                    if (isNaN(weight)) {
                        explainStr += `${h.padEnd(25)} | NaN\n`;
                    } else {
                        const bars = "█".repeat(Math.round(weight * 20));
                        explainStr += `${h.padEnd(25)} | ${bars} (${(weight * 100).toFixed(1)}%)\n`;
                    }
                });
                
                alert(explainStr);
            } else {
                alert("Explanation failed.");
            }
        }

        async function reverseTransaction(txId) {
            if (confirm(`Are you sure you want to reverse transaction #${txId}?`)) {
                const res = await fetch(`/api/admin/reverse/${txId}`, { method: 'POST' });
                if (res.ok) {
                    alert("Transaction reversed successfully.");
                    fetchTransactions();
                } else {
                    alert("Failed to reverse transaction.");
                }
            }
        }

        // Initial load
        fetchTransactions();
        fetchUsers();
    </script>
</body>
</html>
